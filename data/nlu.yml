version: "3.1"
nlu:
- intent: greet
  examples: |
    - hello
    - hi there
    - hey
- intent: goodbye
  examples: |
    - bye
    - see you later
- intent: ask_translation
  examples: |
    - translate [cat](word) into German
    - how do you say [apple](word) in Italian?
    - what’s [dog](word) in English?

- lookup: word
  examples: |
    - invoice
    - contract
    - meeting
    - report
    - language